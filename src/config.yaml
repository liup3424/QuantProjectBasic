# Pipeline configuration in YAML
paths:
  data_dir: "/Users/fionaliu/Desktop/git/data"
  output_dir: "/Users/fionaliu/Desktop/git/output"

dates:
  start_date: "2024-01-01"
  end_date: "2024-03-31"

universe:
  use_default_universe: true
  custom_universe:
